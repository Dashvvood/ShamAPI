# case
# useless if using gunicorn with uvicorn workers
app:
  name: rtmlib
  host: "0.0.0.0"
  port: 8000
  workers: 1
  reload: True

model:
  model_dir: "./model/Qwen2.5-Omni-3B"
  device_map: "auto"  # cpu, cuda, mps
  torch_type: bfloat16  # opencv, onnxruntime, openvino

log:
  level: "INFO"
  sink: "log/Qwen2.5-Omni.log"
  rotation: "10 MB"
  retention: "7 days"
  encoding : "utf-8"
  enqueue: True
  backtrace: True
  diagnose: False
  colorize: True
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {process} | {message}"


