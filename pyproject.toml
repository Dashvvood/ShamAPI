[project]
name = "ShamAPI"
version = "0.1.3"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dashvvood", email = "780966523@qq.com" }
]
requires-python = ">=3.12"
# 基础依赖
dependencies = [
    "tqdm",
    "elinor",
    "loguru",
    "pandas",
    "pyyaml",
    "ipykernel",
    "omegaconf",
    "ipywidgets",
    "concurrent-log-handler",
    "openai",
    "litellm[proxy]",
]

# 可选功能 / 服务依赖（extras）
# 安装示例:
#   uv sync --extra qwen
#   uv sync --extra whisper --extra vllm
#   pip install -e ".[qwen,web]"
[project.optional-dependencies]
audio = [
    "audioread",
    "librosa",
]

web = [
    "aiohttp",
    # litellm proxy needs get_flat_dependant (removed in fastapi>=0.140.10)
    "fastapi>=0.136.3,<=0.140.2",
    "gunicorn",
    "requests",
    "uvicorn",
]

qwen = [
    "ShamAPI[audio,web]",
    "accelerate>=1.11.0",
    "modelscope>=1.35.2",
    "qwen-omni-utils>=0.0.8",
    "qwen-vl-utils>=0.0.14",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "transformers>=4.57.1",
]

whisper = [
    "ShamAPI[audio,web]",
    "openai-whisper>=20250625",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "whisperx==3.7.4",
]

rtmlib = [
    "ShamAPI[web]",
    "moviepy>=1.0.3",
    "onnxruntime-gpu>=1.23.2",
    "opencv-contrib-python>=4.12.0.88",
    "opencv-python>=4.12.0.88",
    "pillow>=12.0.0",
    "rtmlib>=0.0.15",
]

vllm = [
    "modelscope>=1.35.1",
    "vllm>=0.11.0",
]

# 开发依赖（PEP 735）；默认随 uv sync 安装
[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
markers = [
    "integration: needs a running server (e.g. ./run.sh)",
]
