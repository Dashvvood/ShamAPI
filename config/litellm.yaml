# LiteLLM gateway → FastAPI+transformers apps (no vLLM).
# Start apps first, then:
#   litellm --config config/litellm.yaml --host 0.0.0.0 --port 8080

model_list:
  - model_name: qwen3.5
    litellm_params:
      model: openai/qwen3.5
      api_base: http://127.0.0.1:8001/v1
      api_key: "noop"

  - model_name: qwen3-vl
    litellm_params:
      model: openai/qwen3-vl
      api_base: http://127.0.0.1:8002/v1
      api_key: "noop"

router_settings:
  routing_strategy: simple-shuffle

litellm_settings:
  drop_params: true
