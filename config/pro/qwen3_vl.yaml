app:
  name: qwen3_vl
  host: "0.0.0.0"
  port: 8002

model:
  repo_id: "Qwen/Qwen3-VL-2B-Instruct"
  model_dir: "./cache/Qwen3-VL-2B-Instruct"
  device_map: "auto"
  torch_type: bfloat16

run:
  max_new_tokens: 512

log:
  level: "INFO"
  sink: "log/qwen3_vl.log"
  rotation: "10 MB"
  retention: "7 days"
  encoding: "utf-8"
  enqueue: True
  backtrace: True
  diagnose: False
  colorize: True
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {process} | {message}"
