app:
  name: qwen3_5
  host: "0.0.0.0"
  port: 8001

model:
  repo_id: "Qwen/Qwen3.5-2B"
  model_dir: "./cache/Qwen3.5-2B"
  device_map: "auto"
  torch_type: bfloat16

run:
  max_new_tokens: 512

log:
  level: "INFO"
  sink: "log/qwen3_5.log"
  rotation: "10 MB"
  retention: "7 days"
  encoding: "utf-8"
  enqueue: True
  backtrace: True
  diagnose: False
  colorize: True
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {process} | {message}"
