# case
# useless if using gunicorn with uvicorn workers
app:
  name: whisper
  host: "0.0.0.0"
  port: 8000
  workers: 1
  reload: True

model:
  name: "large-v3-turbo"
  device: "cuda"
  download_root: "cache/"
  in_memory: False


log:
  level: "INFO"
  sink: "log/whisper.log"
  rotation: "10 MB"
  retention: "7 days"
  encoding : "utf-8"
  enqueue: True
  backtrace: True
  diagnose: False
  colorize: True
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {process} | {message}"


