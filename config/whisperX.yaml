# case
# useless if using gunicorn with uvicorn workers
app:
  name: whisperX
  host: "0.0.0.0"
  port: 8000
  workers: 1
  reload: True

model:
  whisper_arch: "large-v3"
  device: "cuda"
  download_root: "cache/"
  compute_type: "float16"
  local_files_only: False

run:
  batch_size: 8

log:
  level: "INFO"
  sink: "log/whisperX.log"
  rotation: "10 MB"
  retention: "7 days"
  encoding : "utf-8"
  enqueue: True
  backtrace: True
  diagnose: False
  colorize: True
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {process} | {message}"

